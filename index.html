<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Gestión de inventario, ventas y pedidos para tienda de celulares" />
    <title>iLoc Inventory</title>
    <script>
      // Aplica el tema guardado antes de renderizar para evitar el parpadeo (FOUC).
      ;(function () {
        try {
          var pref = localStorage.getItem('iloc-theme') || 'dark'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#fafafa')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
